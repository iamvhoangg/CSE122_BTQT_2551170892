<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Dashboard Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 230px;
            min-height: 100vh;
            background-color: #212529;
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #0d6efd !important;
            color: #ffffff !important;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-light m-0">

    <div class="d-flex">
        <div class="sidebar p-3 d-none d-md-block">
            <h5 class="fw-bold px-2 py-3 border-bottom border-secondary">CSE.TLU Admin</h5>
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link active px-3 py-2 fw-semibold" href="#">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" href="#">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" href="#">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" href="#">Điểm số</a>
                </li>
            </ul>
        </div>

        <div class="flex-grow-1 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Bảng điều khiển</h3>
                <div>
                    <span class="badge bg-warning text-dark px-3 py-2 me-2 fw-semibold">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 py-2 fw-semibold">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <span class="text-muted small">Sinh viên</span>
                        <h2 class="fw-bold my-2">128</h2>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-primary" style="width: 75%"></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <span class="text-muted small">Đã nộp</span>
                        <h2 class="fw-bold my-2">96</h2>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-success" style="width: 60%"></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <span class="text-muted small">Chưa nộp</span>
                        <h2 class="fw-bold my-2">32</h2>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-danger" style="width: 25%"></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <span class="text-muted small">Điểm TB</span>
                        <h2 class="fw-bold my-2">7.8</h2>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-warning" style="width: 80%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">
                    Tiến độ theo chương
                </div>
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 1 — HTML5</span>
                        <span class="badge bg-success px-2 py-1">100%</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 2 — JavaScript</span>
                        <span class="badge bg-info text-dark px-2 py-1">82%</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 3 — CSS3</span>
                        <span class="badge bg-info text-dark px-2 py-1">74%</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary px-2 py-1">45%</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    =
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
