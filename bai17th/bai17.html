<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Bài 17</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Đăng ký tài khoản</h2>
            <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="fullName">Họ và tên</label>
                <input type="text" id="fullName" placeholder="Nhập họ và tên...">
                <div class="feedback"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập địa chỉ email...">
                <div class="feedback"></div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
                <div class="feedback"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu...">
                <div class="feedback"></div>
            </div>

            <button type="submit" id="submitBtn">Đăng ký</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
