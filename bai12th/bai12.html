<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>In lịch</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="box">

        <div class="calendar">
            <p class="year" id="year">2026</p>
            <p class="month" id="month">Tháng 12</p>
            <p class="day" id="day">24</p>
            <p class="weekday" id="weekday">Thứ năm</p>
        </div>

        <p class="hello" id="hello">Chào buổi sáng!</p>

        <div class="form">

            <div>
                <label for="d">Ngày</label>
                <input type="number" id="d" value="24">
            </div>

            <div>
                <label for="m">Tháng</label>
                <input type="number" id="m" value="12">
            </div>

            <div>
                <label for="y">Năm</label>
                <input type="number" id="y" value="2026">
            </div>

            <button id="btn">In lịch</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
